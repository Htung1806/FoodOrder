<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Chi tiết đơn hàng | Food Order</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link rel="stylesheet" th:href="@{/css/checkout.css}">
	<link rel="stylesheet" th:href="@{/css/admin.css}">
	<link rel="stylesheet" th:href="@{/css/orders.css}">
</head>
<body>
	<div th:replace="~{fragments/site-header :: siteHeader}"></div>
	<main class="main">
		<div class="page-heading">
			<div><div class="eyebrow">Quản lý đơn hàng</div><h1 th:text="${order.orderNumber}"></h1><p class="subtitle">Khách hàng: <strong th:text="${order.customerUsername}"></strong> · <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p></div>
			<a class="button button-secondary" th:href="@{/admin/orders}">← Danh sách đơn</a>
		</div>
		<div class="notice" th:if="${successMessage}" th:text="${successMessage}"></div>
		<div class="notice notice-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
		<div class="order-detail-grid">
			<section class="form-card admin-order-items">
				<h2>Các món đã đặt</h2>
				<div class="checkout-items">
					<article class="checkout-item" th:each="item : ${order.items}">
						<img class="checkout-image" th:src="${item.productImageUrl != null and !#strings.isEmpty(item.productImageUrl) ? item.productImageUrl : '/images/food-placeholder.svg'}"
							 th:alt="${item.productName}" onerror="this.onerror=null;this.src='/images/food-placeholder.svg'">
						<div class="checkout-item-info">
							<h3 th:text="${item.productName}"></h3>
							<p><span th:text="${item.quantity}"></span> × <span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 0, 'POINT')}"></span> ₫</p>
						</div>
						<strong class="checkout-line-total"><span th:text="${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 0, 'POINT')}"></span> ₫</strong>
					</article>
				</div>
				<div class="checkout-total"><span>Tổng tiền</span><strong><span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 0, 'POINT')}"></span> ₫</strong></div>
			</section>
			<aside class="form-card order-information">
				<h2>Thông tin giao hàng</h2>
				<dl>
					<dt>Người nhận</dt><dd th:text="${order.recipientName}"></dd>
					<dt>Số điện thoại</dt><dd th:text="${order.phoneNumber}"></dd>
					<dt>Địa chỉ</dt><dd th:text="${order.deliveryAddress}"></dd>
					<dt>Thanh toán</dt><dd th:text="${order.paymentMethod.label}"></dd>
					<dt>Ghi chú</dt><dd th:text="${order.note != null ? order.note : 'Không có'}"></dd>
				</dl>
				<div class="current-order-status">Trạng thái hiện tại: <span class="order-status"
						  th:classappend="${order.status.name() == 'COMPLETED' ? 'order-status-completed' : (order.status.name() == 'CANCELLED' ? 'order-status-cancelled' : (order.status.name() == 'PENDING' ? 'order-status-pending' : 'order-status-processing'))}"
						  th:text="${order.status.label}"></span></div>
				<form th:if="${!#lists.isEmpty(nextStatuses)}" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="status-form">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<label for="status">Chuyển sang</label>
					<select id="status" name="status" required>
						<option value="" selected disabled>Chọn trạng thái tiếp theo</option>
						<option th:each="status : ${nextStatuses}" th:value="${status}" th:text="${status.label}"></option>
					</select>
					<button class="button" type="submit">Cập nhật trạng thái</button>
				</form>
				<p class="status-terminal" th:if="${#lists.isEmpty(nextStatuses)}">Đơn hàng đã ở trạng thái kết thúc.</p>
			</aside>
		</div>
	</main>
</body>
</html>
