<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quản lý danh mục | Food Order</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<div th:replace="~{fragments/site-header :: siteHeader}"></div>
	<main class="main">
		<div class="page-heading">
			<div><div class="eyebrow">Khu vực quản trị</div><h1>Danh mục món ăn</h1><p class="subtitle">Tạo và sắp xếp các nhóm món ăn trong thực đơn.</p></div>
			<a class="button" th:href="@{/admin/categories/new}">＋ Thêm danh mục</a>
		</div>
		<div class="notice" th:if="${successMessage}" th:text="${successMessage}"></div>
		<div class="notice notice-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
		<div class="table-wrap" th:if="${!#lists.isEmpty(categories)}">
			<table>
				<thead><tr><th>Tên danh mục</th><th>Mô tả</th><th>Thao tác</th></tr></thead>
				<tbody>
					<tr th:each="category : ${categories}">
						<td class="cell-title" th:text="${category.name}"></td>
						<td class="cell-muted" th:text="${category.description != null ? category.description : '—'}"></td>
						<td><div class="row-actions">
							<a class="button button-secondary" th:href="@{/admin/categories/{id}/edit(id=${category.id})}">Sửa</a>
							<form class="inline-form" th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?')">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
								<button class="button button-danger" type="submit">Xóa</button>
							</form>
						</div></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="table-wrap empty" th:if="${#lists.isEmpty(categories)}">
			<div class="empty-icon">🗂️</div><h2>Chưa có danh mục nào</h2><p>Thêm danh mục đầu tiên để bắt đầu quản lý thực đơn.</p>
			<a class="button" th:href="@{/admin/categories/new}">Thêm danh mục</a>
		</div>
	</main>
</body>
</html>
