<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle + ' | Food Order'}">Danh mục | Food Order</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<div th:replace="~{fragments/site-header :: siteHeader}"></div>
	<main class="main">
		<div class="page-heading"><div><div class="eyebrow">Quản lý thực đơn</div><h1 th:text="${pageTitle}">Danh mục</h1><p class="subtitle">Các trường có dấu * là bắt buộc.</p></div></div>
		<form class="form-card" th:action="@{/admin/categories/save}" th:object="${categoryForm}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<input type="hidden" th:field="*{id}">
			<div class="field">
				<label for="name">Tên danh mục *</label>
				<input id="name" type="text" th:field="*{name}" maxlength="100" required autofocus>
				<p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
			</div>
			<div class="field">
				<label for="description">Mô tả <span class="optional">(không bắt buộc)</span></label>
				<textarea id="description" th:field="*{description}" maxlength="500" placeholder="Mô tả ngắn về danh mục"></textarea>
				<p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
			</div>
			<div class="form-actions">
				<button class="button" type="submit">Lưu danh mục</button>
				<a class="button button-secondary" th:href="@{/admin/categories}">Hủy</a>
			</div>
		</form>
	</main>
</body>
</html>
