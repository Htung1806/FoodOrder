<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle + ' | Food Order'}">Món ăn | Food Order</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<div th:replace="~{fragments/site-header :: siteHeader}"></div>
	<main class="main">
		<div class="page-heading"><div><div class="eyebrow">Quản lý thực đơn</div><h1 th:text="${pageTitle}">Món ăn</h1><p class="subtitle">Nhập thông tin món ăn và chọn danh mục tương ứng.</p></div></div>
		<div class="notice notice-error" th:if="${#lists.isEmpty(categories)}">Bạn cần tạo danh mục trước khi thêm món ăn. <a th:href="@{/admin/categories/new}"><strong>Tạo danh mục</strong></a></div>
		<form class="form-card" th:action="@{/admin/products/save}" th:object="${productForm}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<input type="hidden" th:field="*{id}">
			<div class="field">
				<label for="name">Tên món *</label>
				<input id="name" type="text" th:field="*{name}" maxlength="150" required autofocus>
				<p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
			</div>
			<div class="field">
				<label for="description">Mô tả <span class="optional">(không bắt buộc)</span></label>
				<textarea id="description" th:field="*{description}" maxlength="2000" placeholder="Mô tả thành phần hoặc hương vị"></textarea>
				<p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
			</div>
			<div class="field">
				<label for="price">Giá (VNĐ) *</label>
				<input id="price" type="number" th:field="*{price}" min="0.01" step="0.01" required>
				<p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
			</div>
			<div class="field">
				<label for="imageUrl">Đường dẫn ảnh <span class="optional">(không bắt buộc)</span></label>
				<input id="imageUrl" type="text" th:field="*{imageUrl}" maxlength="1000" placeholder="https://... hoặc /images/mon-an.jpg">
				<p class="field-help">Chấp nhận URL http(s) hoặc đường dẫn nội bộ bắt đầu bằng dấu /.</p>
				<p class="field-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></p>
			</div>
			<div class="field">
				<label for="categoryId">Danh mục *</label>
				<select id="categoryId" th:field="*{categoryId}" required>
					<option value="">-- Chọn danh mục --</option>
					<option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
				</select>
				<p class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></p>
			</div>
			<label class="checkbox-field"><input type="checkbox" th:field="*{available}"> Đang còn món</label>
			<div class="form-actions">
				<button class="button" type="submit" th:disabled="${#lists.isEmpty(categories)}">Lưu món ăn</button>
				<a class="button button-secondary" th:href="@{/admin/products}">Hủy</a>
			</div>
		</form>
	</main>
</body>
</html>
