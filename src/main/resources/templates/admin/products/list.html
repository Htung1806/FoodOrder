<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quản lý món ăn | Food Order</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<div th:replace="~{fragments/site-header :: siteHeader}"></div>
	<main class="main">
		<div class="page-heading">
			<div><div class="eyebrow">Khu vực quản trị</div><h1>Món ăn</h1><p class="subtitle">Quản lý thông tin, giá bán, danh mục và tình trạng món ăn.</p></div>
			<a class="button" th:href="@{/admin/products/new}">＋ Thêm món ăn</a>
		</div>
		<div class="notice" th:if="${successMessage}" th:text="${successMessage}"></div>
		<div class="table-wrap" th:if="${!#lists.isEmpty(products)}">
			<table>
				<thead><tr><th>Ảnh</th><th>Tên món</th><th>Danh mục</th><th>Giá</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
				<tbody>
					<tr th:each="product : ${products}">
						<td>
							<img class="product-thumb" th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}" th:src="${product.imageUrl}" th:alt="${product.name}">
							<span class="no-image" th:if="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}" aria-label="Chưa có ảnh">🍽️</span>
						</td>
						<td><div class="cell-title" th:text="${product.name}"></div><div class="cell-muted" th:if="${product.description}" th:text="${product.description}"></div></td>
						<td th:text="${product.category.name}"></td>
						<td class="price"><span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')}"></span> ₫</td>
						<td><span class="badge badge-available" th:if="${product.available}">Còn món</span><span class="badge badge-unavailable" th:unless="${product.available}">Hết món</span></td>
						<td><div class="row-actions">
							<a class="button button-secondary" th:href="@{/admin/products/{id}/edit(id=${product.id})}">Sửa</a>
							<form class="inline-form" th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa món ăn này?')">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
								<button class="button button-danger" type="submit">Xóa</button>
							</form>
						</div></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="table-wrap empty" th:if="${#lists.isEmpty(products)}">
			<div class="empty-icon">🍽️</div><h2>Chưa có món ăn nào</h2><p>Thêm danh mục trước, sau đó tạo món ăn đầu tiên.</p>
			<a class="button" th:href="@{/admin/products/new}">Thêm món ăn</a>
		</div>
	</main>
</body>
</html>
