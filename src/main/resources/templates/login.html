<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#faf9f6">
	<title>Đăng nhập Food Order</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
	<div th:replace="~{fragments/site-header :: siteHeader}"></div>
	<main class="auth-page">
		<section class="auth-card" aria-labelledby="login-title">
			<div class="auth-mark" aria-hidden="true">🍴</div>
			<p class="auth-eyebrow">Chào mừng bạn trở lại</p>
			<h1 id="login-title">Đăng nhập Food Order</h1>
			<p class="auth-intro">Đăng nhập để tiếp tục khám phá những món ngon yêu thích.</p>
			<div class="auth-message auth-success" role="status" th:if="${registrationSuccess}" th:text="${registrationSuccess}"></div>
			<div class="auth-message auth-error" role="alert" th:if="${param.error}">Tên đăng nhập hoặc mật khẩu không đúng.</div>
			<div class="auth-message auth-success" role="status" th:if="${param.logout}">Bạn đã đăng xuất thành công.</div>
			<form class="auth-form" th:action="@{/login}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<label for="username">Tên đăng nhập</label>
				<input id="username" name="username" type="text" autocomplete="username" required autofocus>
				<label for="password">Mật khẩu</label>
				<input id="password" name="password" type="password" autocomplete="current-password" required>
				<button class="auth-submit" type="submit">Đăng nhập</button>
			</form>
			<p class="auth-switch">Bạn chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
		</section>
	</main>
</body>
</html>
